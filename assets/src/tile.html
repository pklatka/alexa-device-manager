<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 440px; height: 280px; overflow: hidden;
    font-family: Roboto, "Liberation Sans", sans-serif;
    background: #16191c;
  }
  .stage { position: relative; width: 440px; height: 280px; padding: 30px 32px; overflow: hidden; }
  .glow {
    position: absolute; width: 420px; height: 420px; border-radius: 50%;
    background: radial-gradient(circle, rgba(245,159,0,.24) 0%, rgba(245,159,0,0) 62%);
    right: -150px; top: -170px;
  }
  .inner { position: relative; height: 100%; display: flex; flex-direction: column; }

  .brand { display: flex; align-items: center; gap: 11px; margin-bottom: 22px; }
  .brand img { width: 42px; height: 42px; display: block; }
  .brand span { font-size: 15px; font-weight: 500; color: #cdd3d9; }

  h1 {
    font-size: 32px; line-height: 1.1; font-weight: 700; color: #fff;
    letter-spacing: -.8px; margin-bottom: 12px;
  }
  h1 em { font-style: normal; color: #ffc94d; }

  p.sub { font-size: 14px; line-height: 1.4; color: #9aa3ab; }

  .foot { margin-top: auto; display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
  .badge {
    font-size: 12px; font-weight: 500; color: #ffc94d;
    border: 1px solid #6b4b06; background: rgba(245,159,0,.13);
    border-radius: 999px; padding: 6px 13px; white-space: nowrap;
  }
  .legal { font-size: 9.5px; line-height: 1.35; color: #5c646c; }
</style>
</head>
<body>
  <div class="stage">
    <div class="glow"></div>
    <div class="inner">
      <div class="brand">
        <img src="../../icons/icon128.png" alt="">
        <span>Device Manager for Alexa</span>
      </div>
      <h1>Star what matters.<br><em>Delete the rest.</em></h1>
      <p class="sub">Bulk-manage your smart home devices from the browser.</p>
      <div class="foot">
        <div class="legal">Not created by or endorsed<br>by Amazon.</div>
        <div class="badge">&#9733; Keep favourites</div>
      </div>
    </div>
  </div>
</body>
</html>
